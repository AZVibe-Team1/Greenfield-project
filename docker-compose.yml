# Docker Compose configuration for Job Portal Application
# This file defines the services, networks, and volumes for the application

services:
  # Backend Service - FastAPI Application
  # This service runs the Python FastAPI backend API server
  backend:
    build:
      # Build context is the project root directory
      # This allows access to both backend/ and pyproject.toml
      context: .
      # Dockerfile location relative to context
      dockerfile: backend/Dockerfile
    container_name: jobportal-backend
    # Port mapping: host:container
    # Access backend at http://localhost:8000
    ports:
      - "8000:8000"
    # Environment variables from .env file
    env_file:
      - .env
    # Volume mounts for development hot-reload
    # Changes to backend code will be reflected without rebuilding
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./chroma_db:/app/chroma_db
      - ./backend/Logs:/app/Logs
    # Restart policy: restart container if it stops unexpectedly
    restart: unless-stopped
    # Health check to ensure service is running
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Networks allow services to communicate with each other
    networks:
      - jobportal-network

  # Frontend Service - Next.js Application (Development)
  # This service runs the Next.js frontend application in development mode
  # Use profile "dev" to run: docker-compose --profile dev up
  frontend:
    profiles:
      - dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobportal-frontend
    # Port mapping: host:container
    # Access frontend at http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - NODE_ENV=development
    # Volume mounts for development hot-reload
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    # Depends on backend service
    # Frontend will wait for backend to be ready
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - jobportal-network

  # Frontend Production Service - Next.js Application (Production)
  # This service builds and serves the Next.js frontend application in production mode
  # Use profile "prod" to run: docker-compose --profile prod up
  frontend-prod:
    profiles:
      - prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: jobportal-frontend-prod
    # Port mapping: host:container
    # Access production frontend at http://localhost:3001
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    # Depends on backend service
    # Frontend will wait for backend to be ready
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - jobportal-network

  # n8n Service - Workflow Automation
  # This service runs n8n for email notifications and workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: jobportal-n8n
    # Port mapping: host:container
    # Access n8n UI at http://localhost:5678
    ports:
      - "5678:5678"
    # Environment variables for n8n configuration
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    # Volume for persistent storage of workflows and data
    volumes:
      - ./n8n_data:/home/node/.n8n
    # Restart policy: restart container if it stops unexpectedly
    restart: unless-stopped
    # Networks allow services to communicate with each other
    networks:
      - jobportal-network
    # Health check to ensure service is running
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Network for inter-service communication
# All services can communicate using service names as hostnames
networks:
  jobportal-network:
    driver: bridge

